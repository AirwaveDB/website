name: Validate website

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Validate JavaScript
        run: node --check app.js
      - name: Validate required UI hooks
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const html = await readFile('index.html', 'utf8');
          const requiredIds = ['country', 'search', 'type', 'status', 'stations', 'summary', 'more', 'station-template'];
          const missing = requiredIds.filter((id) => !html.includes(`id="${id}"`));
          if (missing.length) {
            console.error(`Missing required element IDs: ${missing.join(', ')}`);
            process.exit(1);
          }
          if (!html.includes('src="app.js"') || !html.includes('href="styles.css"')) {
            console.error('index.html must reference app.js and styles.css');
            process.exit(1);
          }
          console.log('Website structure validated');
          NODE
